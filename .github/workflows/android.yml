# Builds the TradeBot Android app (APK) on GitHub's servers and publishes it as a
# release called "Android app", so you can download it straight to your phone.
name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:      # Actions tab → Android app → Run workflow

permissions:
  contents: write         # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners already include the Android SDK (ANDROID_HOME),
      # and Gradle fetches any missing SDK parts itself.

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../TradeBot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TradeBot-apk
          path: TradeBot.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app
          body: |
            Latest TradeBot app, built from commit ${{ github.sha }}.
            On your phone: download TradeBot.apk below → open it → allow "Install unknown apps" for your browser.
          files: TradeBot.apk
          make_latest: true
